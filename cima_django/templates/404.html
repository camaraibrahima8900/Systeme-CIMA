{% extends "base.html" %}
{% block titre %}Page introuvable — CIMA{% endblock %}
{% block contenu %}
    <div style="text-align:center; padding:80px 20px;">
        <div style="font-family:'Fraunces',serif; font-size:72px; font-weight:600;
                    background:linear-gradient(135deg,var(--accent),var(--gold));
                    -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1;">
            404
        </div>
        <h2 style="border:none; justify-content:center; margin-top:16px;">Page introuvable</h2>
        <p style="color:var(--text-muted); max-width:420px; margin:0 auto 28px;">

        </p>
        <a href="{% url 'accueil' %}" class="btn btn-primary">← Retour à l'accueil</a>
    </div>
{% endblock %}
