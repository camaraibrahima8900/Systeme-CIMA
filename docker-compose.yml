services:

  mysql:
    image: mysql:8.0
    pull_policy: never
    container_name: cima_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: gestion_dossiers_victimes
      MYSQL_USER: ibrahima
      MYSQL_PASSWORD: "8900"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dossiers_victimes_accidents.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./keycloak_db.sql:/docker-entrypoint-initdb.d/02_keycloak.sql
    networks:
      - cima_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ibrahima", "-p8900"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # tkinter:
