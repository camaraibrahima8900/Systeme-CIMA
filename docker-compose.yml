  #   restart: unless-stopped
  #   environment:
  #     KC_ADMIN_CLIENT_ID: cima-service
  #     KC_ADMIN_CLIENT_SECRET: CPi08XZpUHZ3TAuFtWRMGNPDZJD0luMB
  #     DISPLAY: ${DISPLAY}
  #     DB_HOST: mysql
  #     DB_PORT: 3306
  #     DB_USER: ibrahima
