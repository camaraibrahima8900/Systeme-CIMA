  #       condition: service_healthy
  #   networks:
  #     - cima_network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    pull_policy: never
    container_name: cima_keycloak
    restart: on-failure
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin1234
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db?allowPublicKeyRetrieval=true&useSSL=false
      KC_DB_USERNAME: ibrahima
      KC_DB_PASSWORD: "8900"
      KC_HOSTNAME: cima-auth
      KC_HOSTNAME_PORT: "8443"
      KC_HOSTNAME_STRICT_HTTPS: "true"
      KC_PROXY: edge
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cima_network

  django:
    build:
      context: ./cima_django
      dockerfile: Dockerfile.django
    container_name: cima_django
    restart: always
    env_file:
      - ./cima_django/.env
    environment:
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "8000:8000"
    volumes:
      - ./cima_django:/app
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - cima_network

  nginx:
    image: nginx:alpine
    container_name: cima_nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
      - "8443:8443"
    depends_on:
      - django
      - keycloak
    networks:
      cima_network:
        aliases:
          - cima-auth

volumes:
  mysql_data:
    driver: local

networks:
  cima_network:
    driver: bridge
